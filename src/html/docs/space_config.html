<div class="apple-page space-config">
  <!-- Hero Section - Sticky -->

    <p class="apple-hero-subtitle apple-fade-in apple-delay-1">從定義容器到切割空間，精準規劃每一寸</p>
  </section>

  <!-- Step 1: 定義容器 -->
  <section class="apple-section">
    <div class="apple-container apple-text-center">
      <h2 class="apple-section-title apple-mb-md apple-fade-in">步驟一：定義容器尺寸</h2>
      <p class="apple-body apple-mb-lg apple-fade-in apple-delay-1">
        輸入容器的長、寬、高，系統會自動建立 3D 模型。<br>

      </p>

        <span class="apple-cta-arrow">→</span>
      </a>

  </section>

  <section class="apple-section">
    <div class="apple-container apple-text-center">

      <p class="apple-body apple-mb-lg apple-fade-in apple-delay-1">

        每個區域可設定不同的用途與優先級，靈活規劃空間配置。
      </p>

    <div class="sticky-content">
      <div class="apple-container apple-text-center">

        <p class="apple-body apple-scale-in apple-delay-1">
          系統會即時計算每個區域的空間利用率，<br>
          顯示已使用容量與剩餘空間。<br><br>
          透過視覺化的容量指示器，您可以快速判斷是否需要調整配置，<br>
          確保每一寸空間都得到最有效的利用。
