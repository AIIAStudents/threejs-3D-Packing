<link rel="stylesheet" href="/src/css/test_version/docs/group_flow.css">

<div class="apple-page group-flow">
  <!-- Hero Section - Sticky -->
  <section class="sticky-hero apple-glow">
    <h1 class="apple-hero-title apple-fade-in">群組流程</h1>
    <p class="apple-hero-subtitle apple-fade-in apple-delay-1">從建立群組到新增物件，兩步驟完成物件管理</p>
  </section>

  <!-- Step 1: 新增群組 -->
  <section class="apple-section">
    <div class="apple-container apple-text-center">
      <h2 class="apple-section-title apple-mb-md apple-fade-in">步驟一：新增群組</h2>
      <p class="apple-body apple-mb-lg apple-fade-in apple-delay-1">
        為不同類型的物件建立專屬群組。<br>
        例如「電子產品」、「家具」、「文具」等，方便後續管理與追蹤。
      </p>
      <a href="#/add-group" class="apple-cta apple-fade-in apple-delay-2">
        <span>前往新增群組</span>
        <span class="apple-cta-arrow">→</span>
      </a>
    </div>
  </section>

  <!-- Step 2: 新增物件 -->
  <section class="apple-section">
    <div class="apple-container apple-text-center">
      <h2 class="apple-section-title apple-mb-md apple-fade-in">步驟二：新增物件</h2>
      <p class="apple-body apple-mb-lg apple-fade-in apple-delay-1">
        在群組中新增物件，輸入物件編號與尺寸（長、寬、高）。<br>
        系統支援單筆或批次新增，快速建立完整清單。
      </p>
      <a href="#/add-inventory" class="apple-cta apple-fade-in apple-delay-2">
        <span>前往新增物件</span>
        <span class="apple-cta-arrow">→</span>
      </a>
    </div>
  </section>

  <!-- Sticky Insight Section -->
  <section class="sticky-section">
    <div class="sticky-content">
      <div class="apple-container apple-text-center">
        <h2 class="apple-section-title apple-mb-md apple-scale-in">為什麼需要群組？</h2>
        <p class="apple-body apple-scale-in apple-delay-1">
          群組化管理讓您能夠將相似或相關的物件集中處理，<br>
          不僅提升資料組織效率，更能在後續的空間配置階段，<br>
          快速篩選特定類型的物件進行裝箱規劃。<br><br>
          良好的分組策略是高效裝箱的第一步。
        </p>
      </div>
    </div>
  </section>
</div>
